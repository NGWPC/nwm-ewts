[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ewts"
version = "3.1.0.0.0"  # OWP requires a 3.1 prefix
description = "NWM EWTS runtime (Error, Warning and Trapping System)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carolyn Maynard" }]
keywords = ["logging", "ewts", "nwm", "ngen"]

# If you truly have no external deps, you can omit this entirely.
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
